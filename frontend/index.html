<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AI-enabled Code Review Assistant — review code changes, detect bugs, and enforce coding standards."
    />
    <title>Code Review Assistant</title>
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <div id="app">
      <div class="landing">
        <div class="landing__logo">Code Review Assistant</div>
        <p class="landing__tagline">
          AI-powered code review platform. Detect bugs, enforce standards, and accelerate
          human-approved review workflows.
        </p>
        <div class="landing__actions">
          <button class="btn btn--primary" id="btn-login" disabled title="Available in Phase 1">
            Sign In
          </button>
          <a class="btn btn--secondary" href="/docs" target="_blank" rel="noopener">
            API Docs
          </a>
        </div>
        <div class="landing__status" id="system-status">
          <div class="landing__status-title">System Status</div>
          <div id="status-content">
            <span class="spinner"></span> Checking services...
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
